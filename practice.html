<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMSA – Practice</title>
    <link rel="icon" href="images/imsa-logo.jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ── Level selector ── */
        .level-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 36px;
            flex-wrap: wrap;
        }
        .level-btn {
            padding: 9px 26px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s;
        }
        .level-btn.easy   { border-color: #4caf50; color: #4caf50; background: transparent; }
        .level-btn.medium { border-color: #00a2ff; color: #00a2ff; background: transparent; }
        .level-btn.hard   { border-color: #e53935; color: #e53935; background: transparent; }
        .level-btn.easy.active,   .level-btn.easy:hover   { background: #4caf50; color: #fff; }
        .level-btn.medium.active, .level-btn.medium:hover { background: #00a2ff; color: #fff; }
        .level-btn.hard.active,   .level-btn.hard:hover   { background: #e53935; color: #fff; }

        /* ── Level badge on title ── */
        .level-badge {
            display: inline-block;
            font-size: 13px;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 10px;
            vertical-align: middle;
        }
        .badge-easy   { background: #4caf50; color: #fff; }
        .badge-medium { background: #00a2ff; color: #fff; }
        .badge-hard   { background: #e53935; color: #fff; }

        .level-panel { display: none; }
        .level-panel.active { display: block; }

        /* ── Difficulty info strip ── */
        .diff-info {
            max-width: 680px;
            margin: 0 auto 28px;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            color: #ccc;
            text-align: left;
        }
        .diff-info.easy   { background: rgba(76,175,80,0.12);  border-left: 4px solid #4caf50; }
        .diff-info.medium { background: rgba(0,162,255,0.12);  border-left: 4px solid #00a2ff; }
        .diff-info.hard   { background: rgba(229,57,53,0.12);  border-left: 4px solid #e53935; }
    </style>
<script>if(localStorage.getItem("ms_theme")==="light")document.documentElement.dataset.theme="light"</script>
<link rel="stylesheet" href="css/site.css">
</head>

<body>

    <!-- Auth Guard -->
    <script>
        if (localStorage.getItem('ms_logged_in') !== 'true') {
            window.location.replace('login.html');
        }
    </script>

    <button class="ms-burger" onclick="msToggleNav()" aria-label="Menu">☰</button>
    <aside class="ms-side" id="msSide">
        <div class="ms-top"><a href="index.html" class="ms-brand"><img src="images/imsa-logo.jpeg" alt="IMSA"><span>IMSA</span></a><button class="ms-x" onclick="msToggleNav()" aria-label="Close menu">«</button></div>
        <nav class="ms-links nav-anim">
            <a href="index.html"><i>🏠</i>Home</a>
            <a href="topics.html"><i>📚</i>Topics</a>
            <a href="practice.html"><i>✏️</i>Practice</a>
            <a href="calculators.html"><i>🧮</i>Calculators</a>
            <a href="articles.html"><i>📝</i>Articles</a>
            <a href="about.html"><i>ℹ️</i>About Us</a>
            <a href="admin.html" id="nav-admin" style="display:none;"><i>🛡️</i>Admin</a>
        </nav>
        <div class="ms-bottom">
            <a href="login.html" id="nav-login"><i>🔑</i>Login</a>
            <a href="#" id="nav-logout" style="display:none;" onclick="handleLogout()"><i>🚪</i>Logout</a>
            <button id="themeBtn" class="ms-theme" title="Dark / Light mode">🌙</button>
        </div>
    </aside>

    <section class="practice-section">
        <h2>Practice Problems</h2>
        <p class="subtitle">University-level practice. Play round by round, earn stars and XP!</p>
        <div id="game"></div>
    </section>

    <footer>
        <p>&copy; 2026 All Rights Reserved | IMSA</p>
    </footer>

    <script>
        function updateAuthNav() {
            const loggedIn = localStorage.getItem('ms_logged_in') === 'true';
            document.getElementById('nav-login').style.display  = loggedIn ? 'none' : 'inline-block';
            document.getElementById('nav-logout').style.display = loggedIn ? 'inline-block' : 'none';
        }
        function handleLogout() {
            localStorage.removeItem('ms_logged_in');
            localStorage.removeItem('ms_user_email');
            updateAuthNav();
        }
        updateAuthNav();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/site.js"></script>
<script src="js/practice.js"></script>
</body>
</html>
